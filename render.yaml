# Render blueprint. Point Render at this repo and it provisions both services.
#
# Why this app moved off Vercel: serverless ran it as many short-lived
# instances, each opening its own MySQL pool from rotating egress IPs. The
# Hostinger database (shared plan: max_user_connections=75, wait_timeout=20s,
# firewall that auto-bans on connection churn) kept dropping those connections,
# which surfaced to users as "Invalid email or password" on the login page.
# One long-lived process on a fixed set of outbound IPs removes that entirely.
services:
  - type: web
    name: nps-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Singapore is the closest Render region to the Hostinger database in
    # Mumbai, and matches the sin1 region Vercel was pinned to.
    region: singapore
    # Standard (2 GB) is the floor, not a preference. Starter is 512 MB, and a
    # Chromium render alone wants 300 MB-1 GB on top of the Next.js server.
    plan: standard
    # MUST stay 1. Every extra instance is another connection pool against a
    # database that allows 75 connections in total — the exact problem this
    # move exists to solve.
    numInstances: 1
    # No healthCheckPath on purpose. /api/health runs `SELECT 1` and returns
    # 503 when the database is unreachable, so wiring it up here would make
    # Render restart the app during a database blip — turning a brief outage
    # into a restart loop. Render still checks the port is listening on deploy.
    envVars:
      # There is one process here, so the pool is the whole application's
      # budget for concurrent queries rather than a per-instance slice. The
      # code defaults to 5, which is correct for Vercel's many lambdas and too
      # small for a single server. Both deployments share Hostinger's
      # 75-connection cap, so this stays well under it.
      - key: DB_POOL_SIZE
        value: "10"
      # sync: false = "prompt me, do not store in git". Copy the values from
      # the Vercel dashboard (`vercel env pull`) — see docs/deployment/render.md.
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SETUP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GST_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OTP_ENABLED
        sync: false
      # These three are compiled into the client bundle at build time, so
      # changing one requires a rebuild, not just a restart.
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_OTP_ENABLED
        sync: false
      - key: NEXT_PUBLIC_PRODUCTION_MODE
        sync: false

  # Replaces the cron entry in vercel.json. Nudges vendors before an RFQ closes
  # and marks silent ones as no-response once it has. The endpoint is guarded
  # by CRON_SECRET, so this is just an authenticated GET on a timer — no reason
  # to rebuild the whole application image for it.
  - type: cron
    name: nps-erp-rfq-reminders
    runtime: node
    region: singapore
    plan: starter
    schedule: "30 3 * * *"
    buildCommand: "echo no build step needed"
    startCommand: 'curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/rfq-reminders"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        sync: false
